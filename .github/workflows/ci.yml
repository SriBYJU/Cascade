name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m mypy engine
      - run: python -m pytest
      - run: python scripts/verify_plugin_layout.py
      - run: optimizer release-gate
      - run: python scripts/release_preflight.py
      - name: Build and inspect wheel
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: |
          python -m build --wheel --outdir .cascade/dist
          python scripts/release_preflight.py --wheel-dir .cascade/dist
      - run: python -m compileall -q engine
      - run: optimizer benchmark
