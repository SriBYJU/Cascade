name: Codex Plugin Smoke

on:
  push:
    branches: [main]
    paths:
      - "plugin.json"
      - ".codex-plugin/**"
      - ".agents/plugins/**"
      - ".codex/**"
      - "skills/**"
      - "engine/resources/**"
      - "engine/project_install.py"
      - "scripts/verify_plugin_layout.py"
      - ".github/workflows/codex-plugin-smoke.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Cascade
        run: python -m pip install -e ".[dev]"

      - name: Install current stable Codex CLI
        run: npm install -g @openai/codex --no-audit --no-fund

      - name: Verify current Codex surfaces
        run: |
          set -euo pipefail
          mkdir -p .cascade
          codex --version
          optimizer doctor > .cascade/codex-doctor.json
          python scripts/verify_plugin_layout.py

      - name: Add public GitHub marketplace and list it
        run: |
          set -euo pipefail
          codex plugin marketplace add SriBYJU/Cascade --ref main
          codex plugin marketplace list | tee .cascade/marketplaces.txt
          grep -q "cascade-local" .cascade/marketplaces.txt

      - name: Project install status uninstall smoke
        run: |
          set -euo pipefail
          TMP_REPO="$(mktemp -d)"
          git -C "$TMP_REPO" init
          optimizer project-install --target "$TMP_REPO"
          optimizer project-status --target "$TMP_REPO"
          optimizer project-uninstall --target "$TMP_REPO"

      - name: Remove marketplace
        if: always()
        run: codex plugin marketplace remove cascade-local || true
