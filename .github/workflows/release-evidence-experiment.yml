name: Release Evidence Experiment

on:
  push:
    branches: ["benchmark/release-evidence"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      CASCADE_MAX_WORKERS: "3"

    steps:
      - name: Initialize isolated Codex home
        run: |
          set -euo pipefail
          echo "CODEX_HOME=$RUNNER_TEMP/codex-home" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/codex-home"

      - name: Check out exact release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 072866d609ba88ec36e9c6c2f226cd52212c4466
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"

      - name: Install Cascade and current stable Codex CLI
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          npm install -g @openai/codex --no-audit --no-fund
          codex --version
          optimizer --help >/dev/null

      - name: Select authenticated Codex credential
        env:
          CODEX_API_KEY_SECRET: ${{ secrets.CODEX_API_KEY }}
          OPENAI_API_KEY_SECRET: ${{ secrets.OPENAI_API_KEY }}
          CODEX_ACCESS_TOKEN_SECRET: ${{ secrets.CODEX_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CODEX_API_KEY_SECRET:-}" ]; then
            printf 'CODEX_API_KEY=%s\n' "$CODEX_API_KEY_SECRET" >> "$GITHUB_ENV"
            echo "Using configured CODEX_API_KEY secret."
          elif [ -n "${OPENAI_API_KEY_SECRET:-}" ]; then
            printf 'CODEX_API_KEY=%s\n' "$OPENAI_API_KEY_SECRET" >> "$GITHUB_ENV"
            echo "Using configured OPENAI_API_KEY secret through CODEX_API_KEY."
          elif [ -n "${CODEX_ACCESS_TOKEN_SECRET:-}" ]; then
            printf 'CODEX_ACCESS_TOKEN=%s\n' "$CODEX_ACCESS_TOKEN_SECRET" >> "$GITHUB_ENV"
            echo "Using configured CODEX_ACCESS_TOKEN secret."
          else
            echo "No repository model credential is configured; falling back to ChatGPT device authentication."
            echo "NEEDS_DEVICE_AUTH=1" >> "$GITHUB_ENV"
          fi

      - name: Authenticate Codex with ChatGPT device code
        if: env.NEEDS_DEVICE_AUTH == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/codex-device-login.log"
          STATUS="$RUNNER_TEMP/codex-device-login.status"
          : > "$LOG"

          (
            set +e
            timeout 900s codex login --device-auth >"$LOG" 2>&1
            echo "$?" > "$STATUS"
          ) &
          LOGIN_PID=$!

          for _ in $(seq 1 45); do
            if grep -Eiq 'https?://|code|device' "$LOG"; then
              sleep 2
              break
            fi
            if ! kill -0 "$LOGIN_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if ! kill -0 "$LOGIN_PID" 2>/dev/null; then
            cat "$LOG"
            wait "$LOGIN_PID" || true
            test -f "$STATUS" && exit "$(cat "$STATUS")"
            exit 1
          fi

          BODY="$(cat "$LOG")"
          if [ -z "$BODY" ]; then
            echo "::error::Codex device login did not emit authorization instructions."
            kill "$LOGIN_PID" || true
            exit 1
          fi

          DRAFT_JSON="$RUNNER_TEMP/device-auth-release.json"
          jq -n \
            --arg tag "device-auth-$GITHUB_RUN_ID" \
            --arg name "TEMPORARY Codex device authentication — run $GITHUB_RUN_ID" \
            --arg body "$BODY" \
            '{tag_name:$tag,name:$name,body:$body,draft:true,prerelease:true}' \
            > "$DRAFT_JSON"

          RELEASE_JSON="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" --input "$DRAFT_JSON")"
          RELEASE_ID="$(printf '%s' "$RELEASE_JSON" | jq -r '.id')"
          echo "DEVICE_DRAFT_RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"
          echo "Temporary private draft release created for the device authorization instructions."

          wait "$LOGIN_PID" || true
          LOGIN_STATUS="$(cat "$STATUS" 2>/dev/null || echo 1)"
          if [ "$LOGIN_STATUS" -ne 0 ]; then
            echo "::error::Codex device authentication did not complete successfully."
            exit "$LOGIN_STATUS"
          fi
          echo "Codex ChatGPT device authentication completed."

      - name: Delete temporary device-auth draft release
        if: always() && env.DEVICE_DRAFT_RELEASE_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$DEVICE_DRAFT_RELEASE_ID"

      - name: Write dated real model profile
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/openai-release-model-profiles.json" <<'JSON'
          [
            {
              "model_id": "gpt-5.6-luna",
              "capability": "quick",
              "reasoning_efforts": ["low", "medium"],
              "local": false,
              "available": true,
              "cost_weight": 0.05,
              "latency_weight": 0.35
            },
            {
              "model_id": "gpt-5.6-luna",
              "capability": "explore",
              "reasoning_efforts": ["low", "medium"],
              "local": false,
              "available": true,
              "cost_weight": 0.05,
              "latency_weight": 0.35
            },
            {
              "model_id": "gpt-5.6-terra",
              "capability": "build",
              "reasoning_efforts": ["low", "medium", "high"],
              "local": false,
              "available": true,
              "cost_weight": 0.5,
              "latency_weight": 0.75
            },
            {
              "model_id": "gpt-5.6-terra",
              "capability": "debug",
              "reasoning_efforts": ["medium", "high", "xhigh"],
              "local": false,
              "available": true,
              "cost_weight": 0.5,
              "latency_weight": 0.8
            },
            {
              "model_id": "gpt-5.6-sol",
              "capability": "deep",
              "reasoning_efforts": ["medium", "high", "xhigh"],
              "local": false,
              "available": true,
              "cost_weight": 1.0,
              "latency_weight": 1.15
            },
            {
              "model_id": "gpt-5.6-sol",
              "capability": "critical",
              "reasoning_efforts": ["high", "xhigh", "max"],
              "local": false,
              "available": true,
              "cost_weight": 1.0,
              "latency_weight": 1.25
            }
          ]
          JSON

      - name: Probe every benchmark model before the full run
        run: |
          set -uo pipefail
          mkdir -p .cascade/release-benchmark/probes
          failed=0
          for model in gpt-5.6-luna gpt-5.6-terra gpt-5.6-sol; do
            echo "Probing $model"
            stdout=".cascade/release-benchmark/probes/$model.jsonl"
            stderr=".cascade/release-benchmark/probes/$model.stderr.txt"
            codex exec \
              --ephemeral \
              --ignore-user-config \
              --json \
              --sandbox read-only \
              --model "$model" \
              --config 'model_reasoning_effort="medium"' \
              "Reply with exactly OK and do not use tools." \
              </dev/null >"$stdout" 2>"$stderr"
            status=$?
            echo "$status" > ".cascade/release-benchmark/probes/$model.exit-code.txt"
            if [ "$status" -ne 0 ]; then
              failed=1
              echo "::error::Probe failed for $model (exit $status)"
              cat "$stderr" || true
              cat "$stdout" || true
            else
              echo "Probe passed for $model"
            fi
          done
          exit "$failed"

      - name: Capture preflight environment
        run: |
          set -euo pipefail
          optimizer doctor > .cascade/release-benchmark/doctor.json
          {
            echo "source_commit=$(git rev-parse HEAD)"
            echo "codex_version=$(codex --version)"
            echo "python_version=$(python --version 2>&1)"
            echo "node_version=$(node --version)"
            echo "run_id=$GITHUB_RUN_ID"
          } > .cascade/release-benchmark/run-info.txt
          cp "$RUNNER_TEMP/openai-release-model-profiles.json" .cascade/release-benchmark/model-profiles.json

      - name: Run authenticated 23-case x 3-repeat release experiment
        run: |
          set -euo pipefail
          optimizer release-benchmark \
            --profiles "$RUNNER_TEMP/openai-release-model-profiles.json" \
            --repeats 3 \
            --output .cascade/release-benchmark

      - name: Run evidence-backed final gate
        run: |
          set -euo pipefail
          optimizer release-gate \
            --benchmark-report .cascade/release-benchmark/live/report.json \
            --parallel-report .cascade/release-benchmark/parallel-live.json \
            | tee .cascade/release-benchmark/release-gate.txt

      - name: Verify measured evidence bundle
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path(".cascade/release-benchmark")
          bundle = json.loads((root / "bundle.json").read_text())
          savings = json.loads((root / "live" / "savings.json").read_text())

          assert bundle.get("measured") is True, bundle
          gate = bundle.get("release_gate") or {}
          assert gate.get("measured_release_evidence") is True, gate

          print("MEASURED RELEASE EVIDENCE: YES")
          print("PUBLIC CLAIM ELIGIBLE:", savings.get("public_claim_eligible"))
          print((root / "live" / "savings.txt").read_text())
          PY

      - name: Add measured result to job summary
        if: success()
        run: |
          {
            echo "## Cascade measured release experiment"
            echo
            cat .cascade/release-benchmark/live/savings.txt
            echo
            cat .cascade/release-benchmark/release-gate.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload complete release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cascade-release-evidence-${{ github.run_id }}
          path: .cascade/release-benchmark
          if-no-files-found: warn
          retention-days: 30
