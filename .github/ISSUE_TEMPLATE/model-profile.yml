name: Model capability profile
description: Propose or correct a runtime capability mapping.
title: "[model] "
labels: [model-profile]
body:
  - type: input
    id: model
    attributes:
      label: Model/provider
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Measured evidence
      description: Include reproducible tasks and results; avoid unsupported general claims.
    validations:
      required: true
