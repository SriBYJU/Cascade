[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cascade-codex"
version = "0.1.0.dev0"
description = "Local-first adaptive orchestration engine for Codex coding workflows"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "SriBYJU"}]
dependencies = ["pydantic>=2.8,<3"]
keywords = ["codex", "agents", "routing", "orchestration", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8", "mypy>=1.11"]

[project.scripts]
optimizer = "engine.cli:main"
cascade = "engine.cli:main"

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.setuptools.package-data]
"engine.resources" = [
  "agents/*.toml",
  "skill/*.md",
  "skill/references/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".cascade"]

[tool.ruff.lint]
select = ["E9", "F", "B"]
# Keep CI focused on correctness; formatting/style is handled separately.

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
exclude = "^benchmarks/fixtures/"
